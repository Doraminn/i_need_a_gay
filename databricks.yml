# This is a Declarative Automation Bundle definition for i_need_a_gay_group.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: i_need_a_gay_group
  uuid: c72c950c-6933-400f-be0c-57f5ac145bc6

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

permissions:
  - group_name: BII_TRAIN_USER
    level: CAN_VIEW
  - user_name: santitham.pro@kmutt.ac.th
    level: CAN_MANAGE

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-1502583690645883.3.azuredatabricks.net
    variables:
      catalog: ctl_training_dev
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-1502583690645883.3.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/santitham.pro@kmutt.ac.th to make sure we only have a single copy.
      root_path: /Workspace/Users/santitham.pro@kmutt.ac.th/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ctl_training_dev
      schema: prod
    permissions:
      - group_name: BII_TRAIN_USER
        level: CAN_MANAGE
      - user_name: santitham.pro@kmutt.ac.th
        level: CAN_MANAGE
