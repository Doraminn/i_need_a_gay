# A sample job for i_need_a_gay_group.

resources:
  jobs:
    sample_job:
      name: i_need_a_gay_group_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: prepare_franchise_feat
          notebook_task:
            notebook_path: ../src/prepare_franchise_feat.ipynb
          existing_cluster_id: "0318-031919-b3fa4xtr"

        - task_key: prepare_franchise_review
          notebook_task:
            notebook_path: ../src/prepare_franchise_review.ipynb
          existing_cluster_id: "0318-031919-b3fa4xtr"

        - task_key: join_franchise
          depends_on:
            - task_key: prepare_franchise_feat
            - task_key: prepare_franchise_review
          notebook_task:
            notebook_path: ../src/join_franchise.ipynb
          existing_cluster_id: "0318-031919-b3fa4xtr"
